spring.application.name=salonbooks
# Default to dev profile locally; override with -Dspring.profiles.active=prod for Docker
spring.profiles.default=dev

spring.mvc.view.prefix=/WEB-INF/view/
spring.mvc.view.suffix=.jsp

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Spring Security 6 / Spring Boot 3.2+ added FORWARD to the default dispatcher
# types, which causes it to intercept InternalResourceViewResolver's forward to
# /WEB-INF/view/*.jsp and redirect those unauthenticated internal forwards to
# /login — creating an infinite redirect loop. Exclude FORWARD so only real
# incoming requests (REQUEST), async operations, and error dispatches are filtered.
spring.security.filter.dispatcher-types=request,error,async
