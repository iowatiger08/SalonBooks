spring.datasource.url=jdbc:h2:mem:salonbooks;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS SALONBOOKS
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
